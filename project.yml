# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: JARVIS
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  JarvisCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JARVIS:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: JarvisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.assistant
        PRODUCT_NAME: JARVIS
        TARGETED_DEVICE_FAMILY: "2"          # iPad first
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: JARVIS
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "JARVIS listens only while you talk to it, so you can speak your requests."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "JARVIS turns your speech into text, on this iPad when supported."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "JARVIS reads your calendar to answer questions and plan your day, and adds or changes events only after you confirm."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "JARVIS reads and creates reminders when you ask it to."
        INFOPLIST_KEY_NSContactsUsageDescription: "JARVIS looks up the person you name so it can prepare a message or call for you to confirm."
        INFOPLIST_KEY_NSCameraUsageDescription: "JARVIS uses the camera only when you choose to take a photo or video."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "JARVIS can save media you export back to your library."
    info:
      path: App/Resources/Info.plist
      properties:
        LSApplicationQueriesSchemes: [instagram, snssdk1233, youtube, spotify, shortcuts]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
schemes:
  JARVIS:
    build:
      targets:
        JARVIS: all
    test:
      gatherCoverageData: true
