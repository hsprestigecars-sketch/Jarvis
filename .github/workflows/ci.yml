name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: JarvisCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test

  ipad-app:
    name: Build iPad app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iPad simulator
        run: |
          xcodebuild build \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  playground-app:
    name: Build Swift Playgrounds package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone
      - name: Check JARVIS.swiftpm is up to date
        run: |
          python3 scripts/make_playground.py
          git diff --exit-code -- JARVIS.swiftpm || (echo "Run scripts/make_playground.py and commit the result" && exit 1)
      - name: Build for iPad simulator
        working-directory: JARVIS.swiftpm
        run: |
          xcodebuild build \
            -scheme JARVIS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../build-playground \
            CODE_SIGNING_ALLOWED=NO
      - name: Confirm Apple on-device AI was compiled in
        run: |
          if xcodebuild -showsdks | grep -q "iphonesimulator26"; then
            grep -rl "AppleIntelligenceBackend" build-playground/Build/Intermediates.noindex >/dev/null && echo "FoundationModels code compiled" || (echo "AppleIntelligenceBackend was not compiled" && exit 1)
          else
            echo "No iOS 26 SDK on this runner; on-device AI not compiled"
          fi
      - name: Show privacy keys in built Info.plist
        run: |
          plist=$(find build-playground -path '*Debug-iphonesimulator/JARVIS.app/Info.plist' | head -1)
          plutil -p "$plist" | grep -i -E 'UsageDescription|CFBundleIdentifier'
